<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApiMoketto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236750A4'/%3E%3Cpath d='M5 23 9.5 9l4.5 14M6.7 18h5.6M19 23V9l4 6.5L27 9v14' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
(() => {
  let pref = null;
  try { pref = localStorage.getItem('apimoketto-theme'); } catch {}
  const dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6750a4;
  --on-primary: #ffffff;
  --primary-container: #eaddff;
  --on-primary-container: #21005d;
  --secondary-container: #e8def8;
  --on-secondary-container: #1d192b;
  --bg: #f3edf7;
  --panel: #fffbff;
  --surface-low: #f7f2fa;
  --surface-high: #ece6f0;
  --surface-highest: #e6e0e9;
  --on-surface: #1d1b20;
  --on-surface-variant: #49454f;
  --outline: #79747e;
  --outline-variant: #cac4d0;
  --error: #b3261e;
  --error-container: #f9dedc;
  --on-error-container: #410e0b;
  --inverse-surface: #322f35;
  --inverse-on-surface: #f5eff7;
  --inverse-primary: #d0bcff;
  --ok: #1e6b34;
  --info: #00639b;
  --warn: #8b5000;
  --get: #1e6b34;
  --get-bg: #c9f0d1;
  --post: #00639b;
  --post-bg: #cde5ff;
  --put: #8b5000;
  --put-bg: #ffdcbe;
  --patch: #6750a4;
  --patch-bg: #eaddff;
  --delete: #b3261e;
  --delete-bg: #f9dedc;
  --other: #49454f;
  --other-bg: #e6e0e9;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3), 0 1px 3px 1px rgba(0, 0, 0, .15);
  --shadow-3: 0 1px 3px rgba(0, 0, 0, .3), 0 4px 8px 3px rgba(0, 0, 0, .15);
  --sans: Roboto, "Segoe UI", system-ui, -apple-system, Ubuntu, sans-serif;
  --mono: "Roboto Mono", ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --primary: #d0bcff;
  --on-primary: #381e72;
  --primary-container: #4f378b;
  --on-primary-container: #eaddff;
  --secondary-container: #4a4458;
  --on-secondary-container: #e8def8;
  --bg: #141218;
  --panel: #1d1b20;
  --surface-low: #211f26;
  --surface-high: #2b2930;
  --surface-highest: #36343b;
  --on-surface: #e6e0e9;
  --on-surface-variant: #cac4d0;
  --outline: #938f99;
  --outline-variant: #49454f;
  --error: #f2b8b5;
  --error-container: #8c1d18;
  --on-error-container: #f9dedc;
  --inverse-surface: #e6e0e9;
  --inverse-on-surface: #322f35;
  --inverse-primary: #6750a4;
  --ok: #8ed99e;
  --info: #94ccff;
  --warn: #ffb870;
  --get: #8ed99e;
  --get-bg: #0f5223;
  --post: #94ccff;
  --post-bg: #004a77;
  --put: #ffb870;
  --put-bg: #693c00;
  --patch: #d0bcff;
  --patch-bg: #4f378b;
  --delete: #f2b8b5;
  --delete-bg: #8c1d18;
  --other: #cac4d0;
  --other-bg: #49454f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--on-surface); font: 400 14px/20px var(--sans); letter-spacing: .25px; -webkit-font-smoothing: antialiased; }
html.theming, html.theming * { transition: background-color .3s var(--ease), border-color .3s var(--ease), color .2s var(--ease) !important; }
#theme .ic { transition: transform .4s var(--ease); }
#theme:active .ic { transform: rotate(-30deg) scale(.9); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: 0; }
.ic { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; display: block; }
.ic.sm { width: 18px; height: 18px; }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-high); padding: 1px 6px; border-radius: 6px; letter-spacing: 0; white-space: nowrap; }

.app { display: grid; grid-template-columns: 88px minmax(0, 1fr); height: 100vh; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0 20px; }
.logo { width: 40px; height: 40px; display: grid; place-items: center; color: var(--primary); margin: 4px 0 20px; }
.rail-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 80px; padding: 0; border: 0; background: none; color: var(--on-surface-variant); font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: .5px; }
.rail-ind { position: relative; overflow: hidden; width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .2s var(--ease); }
.rail-item:hover .rail-ind { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.rail-item.active { color: var(--on-surface); font-weight: 700; }
.rail-item.active .rail-ind { background: var(--secondary-container); color: var(--on-secondary-container); }
.badge { position: absolute; top: -2px; left: 46px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--error); color: var(--panel); font-size: 11px; font-weight: 500; line-height: 16px; text-align: center; }

.content { display: grid; grid-template-rows: 64px minmax(0, 1fr); min-width: 0; min-height: 0; }
.appbar { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 8px; }
.appbar h1 { margin: 0; font-size: 22px; font-weight: 400; line-height: 28px; letter-spacing: 0; }
.appbar .count { color: var(--on-surface-variant); font-size: 14px; }
.spacer { flex: 1; }
main { min-height: 0; padding: 0 16px 16px 0; }

.split { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 12px; height: 100%; }
.panel { background: var(--panel); border-radius: 16px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow: auto; min-height: 0; flex: 1; }

.list-head { display: flex; align-items: center; gap: 8px; padding: 12px; }
.list-head .search { flex: 1; min-width: 0; margin: 0; }
.add-btn { position: relative; overflow: hidden; width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex-shrink: 0; transition: box-shadow .2s; }
.add-btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
.add-btn:hover { box-shadow: var(--shadow-1); }
.add-btn:hover::before { opacity: .08; }
.add-btn[aria-expanded="true"]::before { opacity: .12; }
.menu { position: fixed; z-index: 30; min-width: 260px; max-width: 340px; padding: 8px 0; border-radius: 8px; background: var(--surface-high); box-shadow: var(--shadow-3); transform-origin: top right; animation: menu-in .16s var(--ease); }
.menu.up { transform-origin: bottom right; }
@keyframes menu-in { from { opacity: 0; transform: scale(.92); } }
.menu-item { position: relative; overflow: hidden; width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 6px 20px 6px 14px; border: 0; background: none; color: var(--on-surface); text-align: left; font-size: 14px; }
.menu-item:hover, .menu-item:focus-visible { background: color-mix(in srgb, var(--on-surface) 8%, transparent); outline: 0; }
.menu-item > .ic { color: var(--on-surface-variant); }
.menu-item span { display: flex; flex-direction: column; min-width: 0; }
.menu-item small { color: var(--on-surface-variant); font-size: 12px; line-height: 16px; }
.menu hr { margin: 8px 0; border: 0; border-top: 1px solid var(--outline-variant); }
.search { display: flex; align-items: center; gap: 12px; height: 48px; margin: 12px; padding: 0 16px; border-radius: 24px; background: var(--surface-high); color: var(--on-surface-variant); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--on-surface); font-size: 16px; }
.search input::placeholder { color: var(--on-surface-variant); }

.list { padding: 0 12px 12px; }
.list-item { position: relative; overflow: hidden; width: 100%; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px 8px 12px; border: 0; border-radius: 12px; background: none; text-align: left; transition: background-color .15s; }
.list-item:hover { background: color-mix(in srgb, var(--on-surface) 6%, transparent); }
.list-item.active { background: var(--secondary-container); color: var(--on-secondary-container); }
.list-item.off .li-text, .list-item.off .method { opacity: .45; }
.li-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li-head { font-size: 15px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-head.mono { font-size: 14px; }
.li-sup { color: var(--on-surface-variant); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item.active .li-sup { color: inherit; opacity: .8; }
.li-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); flex-shrink: 0; }

.method { display: inline-block; flex-shrink: 0; min-width: 58px; padding: 3px 8px; border-radius: 8px; font: 500 11px/16px var(--mono); letter-spacing: .4px; text-align: center; color: var(--other); background: var(--other-bg); }
.m-GET { color: var(--get); background: var(--get-bg); }
.m-POST { color: var(--post); background: var(--post-bg); }
.m-PUT { color: var(--put); background: var(--put-bg); }
.m-PATCH { color: var(--patch); background: var(--patch-bg); }
.m-DELETE { color: var(--delete); background: var(--delete-bg); }
.status { font: 500 13px/20px var(--mono); }
.s2 { color: var(--ok); }
.s3 { color: var(--info); }
.s4 { color: var(--warn); }
.s5 { color: var(--error); }

.editor { max-width: 960px; padding: 20px 28px 48px; }
.ed-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.ed-title { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 12px; }
.ed-title h2 { margin: 0; font-size: 24px; font-weight: 400; line-height: 32px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.unsaved { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; margin-right: 8px; border-radius: 8px; background: var(--surface-high); color: var(--on-surface-variant); font-size: 13px; font-weight: 500; }
.unsaved::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.grow { flex: 1; min-width: 220px; }
.w-sm { width: 128px; }
.w-md { width: 160px; }

.tf { position: relative; display: block; }
.tf input, .tf select { width: 100%; height: 56px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 4px; background: transparent; color: var(--on-surface); font-size: 16px; outline: 0; transition: border-color .15s, box-shadow .15s; }
.tf input.mono, .tf select.mono { font-size: 15px; }
.tf select { appearance: none; padding-right: 40px; cursor: pointer; }
.tf select option { background: var(--panel); color: var(--on-surface); }
.tf .arrow { position: absolute; right: 10px; top: 16px; pointer-events: none; color: var(--on-surface-variant); }
.tf > span { position: absolute; left: 12px; top: 18px; padding: 0 4px; background: var(--panel); color: var(--on-surface-variant); font-size: 16px; line-height: 20px; pointer-events: none; transition: top .15s var(--ease), font-size .15s var(--ease), color .15s; }
.tf input:focus ~ span, .tf input:not(:placeholder-shown) ~ span, .tf select ~ span { top: -9px; font-size: 12px; line-height: 16px; }
.tf input:hover, .tf select:hover { border-color: var(--on-surface); }
.tf input:focus, .tf select:focus { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.tf input:focus ~ span, .tf select:focus ~ span { color: var(--primary); }
.tf input::-webkit-inner-spin-button, .tf input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.tf input[type=number] { -moz-appearance: textfield; }
.supporting { color: var(--on-surface-variant); font-size: 12px; line-height: 16px; margin: -6px 0 20px; }
.supporting.err { color: var(--error); margin: 6px 0 0; }

textarea.code { display: block; width: 100%; min-height: 240px; padding: 14px 16px; border: 1px solid var(--outline); border-radius: 4px; background: transparent; color: var(--on-surface); font: 13px/1.6 var(--mono); letter-spacing: 0; tab-size: 2; white-space: pre; resize: vertical; outline: 0; }
textarea.code:hover { border-color: var(--on-surface); }
textarea.code:focus { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
textarea.code.bad, textarea.code.bad:focus { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
textarea.code.small { min-height: 90px; }

.switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; min-height: 40px; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.track { position: relative; width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--outline); background: var(--surface-highest); transition: background-color .2s, border-color .2s; flex-shrink: 0; }
.thumb { position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transform: translateY(-50%); transition: all .2s var(--ease); display: grid; place-items: center; }
.thumb .ic { width: 16px; height: 16px; opacity: 0; color: var(--on-primary-container); }
.switch input:checked + .track { background: var(--primary); border-color: var(--primary); }
.switch input:checked + .track .thumb { left: 22px; width: 24px; height: 24px; background: var(--on-primary); }
.switch input:checked + .track .thumb .ic { opacity: 1; color: var(--primary); }
.switch:active .thumb { width: 28px; height: 28px; }
.switch input:focus-visible + .track { outline: 3px solid var(--primary); outline-offset: 2px; }

.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 24px; border: 0; border-radius: 20px; font-size: 14px; font-weight: 500; letter-spacing: .1px; white-space: nowrap; background: none; color: var(--primary); }
.btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; }
.btn:hover::before { opacity: .08; }
.btn:focus-visible::before { opacity: .12; }
.btn.icon-l { padding-left: 16px; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.filled:hover { box-shadow: var(--shadow-1); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.outlined { border: 1px solid var(--outline); }
.btn.text { padding: 0 12px; }
.btn.danger { color: var(--error); }
.icon-btn { position: relative; overflow: hidden; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--on-surface-variant); display: inline-grid; place-items: center; flex-shrink: 0; }
.icon-btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
.icon-btn:hover::before { opacity: .08; }
.icon-btn.danger:hover { color: var(--error); }

.chip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border: 1px solid var(--outline-variant); border-radius: 8px; background: none; color: var(--on-surface-variant); font-size: 13px; font-weight: 500; }
.chip:hover { background: color-mix(in srgb, var(--on-surface) 6%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); }
.dot.on { background: var(--ok); }

.seg { display: inline-flex; height: 40px; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; }
.seg button { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border: 0; background: none; color: var(--on-surface); font-size: 14px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--outline); }
.seg button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.seg button.on { background: var(--secondary-container); color: var(--on-secondary-container); }

.card { border: 1px solid var(--outline-variant); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px 8px 20px; flex-wrap: wrap; }
.card-head h3 { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .15px; }
.card-head .sub { color: var(--on-surface-variant); font-size: 13px; }
.card-body { padding: 4px 20px 20px; }
.card-body.flush { padding: 0; border-top: 1px solid var(--outline-variant); }
.note { color: var(--on-surface-variant); font-size: 13px; line-height: 22px; }
.note.err { color: var(--error); }

.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) 40px; gap: 12px; align-items: center; margin-top: 12px; }
.kv:first-child { margin-top: 4px; }

.try-row { display: flex; gap: 12px; align-items: center; margin: 4px 0 12px; }
.response { margin-top: 16px; border-radius: 12px; background: var(--surface-low); overflow: hidden; }
.response-head { display: flex; gap: 16px; align-items: center; padding: 12px 16px; color: var(--on-surface-variant); font-size: 13px; }
pre.out { margin: 0; padding: 16px 20px; overflow: auto; max-height: 440px; font: 13px/1.6 var(--mono); letter-spacing: 0; white-space: pre-wrap; word-break: break-word; }
.headers { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 20px; padding: 0 16px 14px; margin: 0; font: 12px/18px var(--mono); letter-spacing: 0; }
.headers dt { color: var(--on-surface-variant); }
.headers dd { margin: 0; word-break: break-all; }

.endpoints { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; }
.endpoints .ep { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.endpoints .ep small { color: var(--on-surface-variant); font: 13px var(--sans); margin-left: 8px; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 24px; text-align: center; color: var(--on-surface-variant); }
.empty .ic { width: 40px; height: 40px; opacity: .6; }
.blank { height: 100%; display: grid; place-items: center; text-align: center; color: var(--on-surface-variant); padding: 40px; }
.blank h2 { margin: 16px 0 8px; font-size: 22px; font-weight: 400; color: var(--on-surface); }
.blank p { margin: 0 auto 24px; max-width: 380px; }
.blank .art { width: 96px; height: 96px; margin: 0 auto; border-radius: 28px; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); }
.blank .art .ic { width: 44px; height: 44px; }

.log-split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 12px; height: 100%; }
.toolbar { display: flex; align-items: center; gap: 8px; padding-right: 12px; }
.toolbar .search { flex: 1; }
.filter-chip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 8px; background: none; color: var(--on-surface-variant); font-size: 13px; font-weight: 500; white-space: nowrap; }
.filter-chip.on { border-color: transparent; background: var(--secondary-container); color: var(--on-secondary-container); padding-left: 8px; }
.log-detail { padding: 20px 24px 40px; }
.log-detail h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; font: 400 18px/26px var(--mono); letter-spacing: 0; word-break: break-all; }
.banner { display: flex; align-items: center; gap: 16px; padding: 12px 12px 12px 16px; margin-bottom: 16px; border-radius: 12px; background: var(--error-container); color: var(--on-error-container); }
.banner span { flex: 1; }
.banner .btn { color: var(--on-error-container); }
.log-foot { display: flex; align-items: center; padding: 8px 12px 8px 24px; color: var(--on-surface-variant); font-size: 13px; border-top: 1px solid var(--outline-variant); }

.settings { max-width: 760px; padding: 24px 28px 48px; }
.ref { width: 100%; border-collapse: collapse; }
.ref td { padding: 10px 0; border-bottom: 1px solid var(--outline-variant); vertical-align: top; font-size: 13px; }
.ref tr:last-child td { border-bottom: 0; }
.ref td:first-child { padding-right: 24px; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; color: var(--primary); letter-spacing: 0; }
.ref td:last-child { color: var(--on-surface-variant); }

.snackbar { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 24px); min-width: 280px; max-width: min(560px, calc(100vw - 32px)); display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 4px; background: var(--inverse-surface); color: var(--inverse-on-surface); box-shadow: var(--shadow-3); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); z-index: 20; }
.snackbar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.snackbar .ic { color: var(--inverse-primary); }
.snackbar.err .ic { color: #f2b8b5; }

dialog { border: 0; padding: 24px; width: min(400px, calc(100vw - 48px)); border-radius: 28px; background: var(--surface-high); color: var(--on-surface); box-shadow: var(--shadow-3); }
dialog.wide { width: min(760px, calc(100vw - 48px)); }
dialog .tf > span { background: var(--surface-high); }
dialog textarea.code { min-height: 300px; max-height: 50vh; }
dialog p code { background: var(--surface-highest); }
.dialog-row { display: flex; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.banner.info { align-items: flex-start; background: var(--secondary-container); color: var(--on-secondary-container); }
.banner.info .btn, .banner.info .icon-btn { color: var(--on-secondary-container); }
.banner ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.banner strong { font-weight: 500; }
dialog::backdrop { background: rgba(0, 0, 0, .32); }
dialog[open] { animation: rise .25s var(--ease); }
dialog h2 { margin: 0 0 16px; font-size: 24px; font-weight: 400; line-height: 32px; }
dialog p { margin: 0 0 24px; color: var(--on-surface-variant); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
@keyframes rise { from { opacity: 0; transform: scale(.94); } }

.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); animation: ripple .5s var(--ease) forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

@media (max-width: 960px) {
  .split, .log-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 2fr) minmax(0, 3fr); }
  .editor, .settings { padding: 16px 16px 40px; }
}
@media (max-width: 600px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 80px; }
  .rail { grid-row: 2; flex-direction: row; justify-content: space-around; padding: 12px 0 16px; background: var(--panel); }
  .logo { display: none; }
  main { padding: 0 8px 8px; }
  .appbar { padding: 0 16px; }
}

const THEME_KEY = 'apimoketto-theme';
const systemDark = matchMedia('(prefers-color-scheme: dark)');

function themePref() {
  try {
    const v = localStorage.getItem(THEME_KEY);
    return v === 'light' || v === 'dark' ? v : 'system';
  } catch {
    return 'system';
  }
}

function applyTheme() {
  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'system' && systemDark.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const btn = document.getElementById('theme');
  if (btn) {
    btn.innerHTML = icon(dark ? 'light' : 'dark');
    btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  }
}

let themingTimer;
function setTheme(pref) {
  try {
    if (pref === 'system') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, pref);
  } catch {}
  const root = document.documentElement;
  root.classList.add('theming');
  clearTimeout(themingTimer);
  themingTimer = setTimeout(() => root.classList.remove('theming'), 350);
  applyTheme();
  const seg = document.getElementById('theme-seg');
  if (seg) seg.outerHTML = themeSegment();
}

function themeSegment() {
  const pref = themePref();
  return `<div class="seg" id="theme-seg">${[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button class="${pref === v ? 'on' : ''}" data-act="set-theme" data-v="${v}">${icon(pref === v ? 'check' : v, 'sm')}${l}</button>`).join('')}</div>`;
}

systemDark.addEventListener('change', applyTheme);

const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;

const S = {
  config: null,
  file: '',
  tab: 'routes',
  sel: { routes: null, resources: null },
  draft: null,
  dirty: false,
  filter: '',
  test: null,
  testResult: '',
  live: null,
  log: [],
  logSel: null,
  logFilter: '',
  onlyMissed: false,
  unseen: 0,
  settings: null,
  importers: []
};

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
const sClass = s => 's' + String(s)[0];
const pretty = text => {
  try {
    return JSON.stringify(JSON.parse(text), null, 2);
  } catch {
    return text;
  }
};
const samplePath = p => p.replace(/:(\w+)\?/g, '1').replace(/:(\w+)/g, '1').replace(/\/\*$/, '/anything').replace(/\*/g, 'anything');

function textField(label, bind, value, { type = 'text', mono = false, cls = '', attrs = '' } = {}) {
  return `<label class="tf ${cls}"><input class="${mono ? 'mono' : ''}" type="${type}" ${bind} value="${esc(value)}" placeholder=" " spellcheck="false" ${attrs}><span>${label}</span></label>`;
}

function selectField(label, bind, options, value, cls = '') {
  return `<label class="tf ${cls}"><select class="mono" ${bind}>${options.map(o => `<option ${o === value ? 'selected' : ''}>${o}</option>`).join('')}</select><span>${label}</span>${icon('drop', 'arrow')}</label>`;
}

function switchField(label, bind, checked) {
  return `<label class="switch"><input type="checkbox" ${bind} ${checked ? 'checked' : ''}><span class="track"><span class="thumb">${icon('check')}</span></span><span>${label}</span></label>`;
}

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let snackTimer;
function snack(message, kind = 'ok') {
  const el = $('#snackbar');
  el.className = 'snackbar' + (kind === 'err' ? ' err' : '');
  el.innerHTML = `${icon(kind === 'err' ? 'error' : 'check')}<span>${esc(message)}</span>`;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove('show'), kind === 'err' ? 5000 : 2600);
}

function ask({ title, text, ok = 'OK', danger = false }) {
  return new Promise(resolve => {
    const d = $('#dialog');
    d.className = '';
    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      if (d.open) d.close();
      resolve(v);
    };
    d.innerHTML = `<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="dialog-actions"><button class="btn text" data-v="no">Cancel</button><button class="btn text ${danger ? 'danger' : ''}" data-v="yes">${esc(ok)}</button></div>`;
    d.querySelectorAll('button').forEach(b => (b.onclick = () => finish(b.dataset.v === 'yes')));
    d.onclose = () => finish(false);
    d.showModal();
    d.querySelector('[data-v="yes"]').focus();
  });
}

async function guard() {
  if (!S.dirty) return true;
  const ok = await ask({ title: 'Discard changes?', text: "You've got edits that aren't saved yet. They'll be lost if you leave now.", ok: 'Discard', danger: true });
  if (ok) S.dirty = false;
  return ok;
}

function markDirty() {
  S.dirty = true;
  document.querySelectorAll('.unsaved').forEach(el => (el.hidden = false));
}

async function saveConfig(next) {
  const { config } = await api('PUT', '/config', next);
  S.config = config;
  return config;
}

function routeDraft(r) {
  const text = typeof r.body === 'string';
  return {
    kind: 'route',
    id: r.id,
    isNew: false,
    name: r.name,
    method: r.method,
    path: r.path,
    status: r.status,
    delay: r.delay,
    failRate: Math.round(r.failRate * 100),
    failStatus: r.failStatus,
    enabled: r.enabled,
    headers: Object.entries(r.headers || {}),
    bodyType: r.body === null ? 'none' : text ? 'text' : 'json',
    bodyText: r.body === null ? '' : text ? r.body : JSON.stringify(r.body, null, 2)
  };
}

function newRouteDraft(seed = {}) {
  return {
    kind: 'route',
    id: rid(),
    isNew: true,
    name: '',
    method: 'GET',
    path: '/api/',
    status: 200,
    delay: 0,
    failRate: 0,
    failStatus: 500,
    enabled: true,
    headers: [],
    bodyType: 'json',
    bodyText: '{\n  "message": "hello"\n}',
    ...seed
  };
}

function draftToRoute(d) {
  const path = String(d.path || '').trim();
  if (!path.startsWith('/')) throw new Error('The path needs to start with a /');
  const status = Number(d.status);
  if (!Number.isInteger(status) || status < 100 || status > 599) throw new Error('Status should be somewhere between 100 and 599');
  let body = null;
  if (d.bodyType === 'json' && d.bodyText.trim()) {
    try {
      body = JSON.parse(d.bodyText);
    } catch (e) {
      throw new Error("The body isn't valid JSON: " + e.message);
    }
  } else if (d.bodyType === 'text') body = d.bodyText;
  return {
    id: d.id,
    name: String(d.name || '').trim(),
    method: d.method,
    path,
    status,
    delay: Math.max(0, Number(d.delay) || 0),
    failRate: Math.min(100, Math.max(0, Number(d.failRate) || 0)) / 100,
    failStatus: Number(d.failStatus) || 500,
    enabled: !!d.enabled,
    headers: Object.fromEntries(d.headers.filter(([k]) => k.trim()).map(([k, v]) => [k.trim(), v])),
    body
  };
}

function resourceDraft(r) {
  return {
    kind: 'resource',
    id: r.id,
    isNew: false,
    name: r.name,
    path: r.path,
    idField: r.idField,
    persist: r.persist,
    enabled: r.enabled,
    dataText: JSON.stringify(r.data, null, 2)
  };
}

function newResourceDraft() {
  return {
    kind: 'resource',
    id: rid(),
    isNew: true,
    name: 'posts',
    path: '/api/posts',
    idField: 'id',
    persist: false,
    enabled: true,
    dataText: '[\n  { "id": 1, "title": "First post" }\n]'
  };
}

function draftToResource(d) {
  const path = String(d.path || '').trim();
  if (!path.startsWith('/')) throw new Error('The path needs to start with a /');
  let data;
  try {
    data = JSON.parse(d.dataText || '[]');
  } catch (e) {
    throw new Error("The seed data isn't valid JSON: " + e.message);
  }
  if (!Array.isArray(data)) throw new Error('Seed data has to be an array, like [ {...}, {...} ]');
  return {
    id: d.id,
    name: String(d.name || '').trim() || path.split('/').pop(),
    path,
    idField: String(d.idField || 'id').trim() || 'id',
    persist: !!d.persist,
    enabled: !!d.enabled,
    data
  };
}

function testFor(d) {
  if (d.kind === 'resource') return { method: 'GET', url: d.path, body: '' };
  return { method: d.method === 'ANY' ? 'GET' : d.method, url: samplePath(d.path), body: BODY_METHODS.includes(d.method) ? '{\n  \n}' : '' };
}

function setDraft(d) {
  S.draft = d;
  S.notes = null;
  S.dirty = !!(d && d.isNew);
  S.test = d ? testFor(d) : null;
  S.testResult = '';
  S.live = null;
  if (d && S.tab in S.sel) S.sel[S.tab] = d.id;
  if (d && d.kind === 'resource' && !d.isNew) loadLive();
}

function restoreDraft() {
  const id = S.sel[S.tab];
  if (S.tab === 'routes') {
    const r = S.config.routes.find(x => x.id === id) || (id === null ? S.config.routes[0] : null);
    setDraft(r ? routeDraft(r) : null);
  } else if (S.tab === 'resources') {
    const r = S.config.resources.find(x => x.id === id) || (id === null ? S.config.resources[0] : null);
    setDraft(r ? resourceDraft(r) : null);
  } else setDraft(null);
}

async function go(tab) {
  if (tab === S.tab) return;
  if (!(await guard())) return;
  S.tab = tab;
  history.replaceState(null, '', '#' + tab);
  if (tab === 'log') {
    S.unseen = 0;
    updateBadge();
  }
  if (tab === 'settings') S.settings = { ...S.config.settings };
  restoreDraft();
  render();
}

function updateChrome() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  $('#title').textContent = TITLES[S.tab];
  const n = S.tab === 'routes' ? S.config.routes.length : S.tab === 'resources' ? S.config.resources.length : S.tab === 'log' ? S.log.length : null;
  $('#count').textContent = n === null ? '' : n;
}

function render() {
  closeMenu();
  updateChrome();
  const view = $('#view');
  if (S.tab === 'routes') view.innerHTML = viewRoutes();
  else if (S.tab === 'resources') view.innerHTML = viewResources();
  else if (S.tab === 'log') view.innerHTML = viewLog();
  else view.innerHTML = viewSettings();
  validateText();
}

function renderList() {
  const el = $('#list');
  if (el) el.innerHTML = S.tab === 'routes' ? routeItems() : resourceItems();
}

function emptyList(any, what) {
  return `<div class="empty">${icon('inbox')}<span>${any ? `No ${what} match that search.` : `No ${what} yet. Hit the + button to add one.`}</span></div>`;
}

function routeItems() {
  const f = S.filter.toLowerCase();
  const list = S.config.routes.filter(r => !f || `${r.method} ${r.path} ${r.name}`.toLowerCase().includes(f));
  if (!list.length) return emptyList(S.config.routes.length, 'routes');
  return list.map(r => `
    <button class="list-item ${S.draft && S.draft.id === r.id ? 'active' : ''} ${r.enabled ? '' : 'off'}" data-route="${esc(r.id)}">
      <span class="method m-${r.method}">${r.method}</span>
      <span class="li-text"><span class="li-head mono">${esc(r.path)}</span><span class="li-sup">${esc(r.name || (r.enabled ? 'Untitled' : 'Disabled'))}</span></span>
      <span class="status ${sClass(r.status)}">${r.status}</span>
    </button>`).join('');
}

function resourceItems() {
  const f = S.filter.toLowerCase();
  const list = S.config.resources.filter(r => !f || `${r.name} ${r.path}`.toLowerCase().includes(f));
  if (!list.length) return emptyList(S.config.resources.length, 'resources');
  return list.map(r => `
    <button class="list-item ${S.draft && S.draft.id === r.id ? 'active' : ''} ${r.enabled ? '' : 'off'}" data-res="${esc(r.id)}">
      <span class="li-icon">${icon('storage')}</span>
      <span class="li-text"><span class="li-head">${esc(r.name)}</span><span class="li-sup mono">${esc(r.path)}</span></span>
      <span class="li-sup">${r.data.length} item${r.data.length === 1 ? '' : 's'}</span>
    </button>`).join('');
}

function listPanel(placeholder, items, act, label, extra = '') {
  return `<section class="panel">
    <div class="list-head">
      <div class="search">${icon('search')}<input id="filter" placeholder="${placeholder}" value="${esc(S.filter)}" autocomplete="off"></div>
      ${extra}
      <button class="add-btn" data-act="${act}" title="${label}" ${act === 'add-menu' ? 'aria-haspopup="menu" aria-expanded="false"' : ''}>${icon('add')}</button>
    </div>
    <div class="scroll list" id="list">${items}</div>
  </section>`;
}

function blank(art, title, text, act, label, extra = '') {
  return `<div class="blank"><div><div class="art">${icon(art)}</div><h2>${title}</h2><p>${text}</p>${act ? `<button class="btn filled icon-l" data-act="${act}">${icon('add', 'sm')}${label}</button>` : ''}${extra}</div></div>`;
}

function viewRoutes() {
  return `<div class="split">
    ${listPanel('Search routes', routeItems(), 'new-route', 'New route')}
    <section class="panel"><div class="scroll">${S.draft ? routeEditor() : blank('route', 'No route selected', 'A route answers one method and path with whatever you tell it to, a fixed JSON body, some text, or something generated from the request.', 'new-route', 'New route')}</div></section>
  </div>`;
}

function viewResources() {
  return `<div class="split">
    ${listPanel('Search resources', resourceItems(), 'add-menu', 'Add a resource')}
    <section class="panel"><div class="scroll">${S.draft ? resourceEditor() : blank('storage', 'No resource selected', 'A resource gives you a whole collection, list, create, read, update and delete, backed by data that lives in memory.', 'new-resource', 'New resource', `<button class="btn text icon-l" data-act="import-code" style="margin-left:8px">${icon('code', 'sm')}Import from code</button>`)}</div></section>

}

    </div>
  </div>`;
}

function tryCard() {
  const t = S.test;
  return `<div class="card" id="try">

    <div class="card-body">
      <div class="try-row">
        ${selectField('Method', 'data-t="method"', METHODS.filter(m => m !== 'ANY'), t.method, 'w-md')}
        ${textField('URL', 'data-t="url"', t.url, { mono: true, cls: 'grow' })}
        <button class="btn filled icon-l" data-act="send" title="Send (Ctrl+Enter)">${icon('send', 'sm')}Send</button>

      <textarea class="code small" data-t="body" placeholder="Request body, if you need one" spellcheck="false">${esc(t.body)}</textarea>
      <div id="try-result">${S.testResult}</div>
    </div>
  </div>`;
}

function headerList(h) {
  const entries = Object.entries(h || {});
  if (!entries.length) return '<div class="note" style="padding:0 16px 14px">No headers</div>';
  return `<dl class="headers">${entries.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}

function logMatches(e) {
  if (S.onlyMissed && e.source) return false;
  const f = S.logFilter.toLowerCase();
  return !f || `${e.method} ${e.path} ${e.status} ${e.source ? e.source.label : ''}`.toLowerCase().includes(f);
}

function logRows() {
  const rows = S.log.filter(logMatches);
  if (!rows.length) return `<div class="empty">${icon('inbox')}<span>${S.log.length ? 'Nothing matches that filter.' : `Quiet so far. Point your frontend at <code>${esc(ORIGIN)}</code> and requests will show up here.`}</span></div>`;
  return rows.map(e => `<button class="list-item ${S.logSel === e.id ? 'active' : ''}" data-log="${e.id}">
    <span class="method m-${e.method}">${e.method}</span>
    <span class="li-text">
      <span class="li-head mono">${esc(e.path)}</span>
      <span class="li-sup">${e.source ? esc(e.source.label) + (e.source.failed ? ', simulated failure' : '') : '<span style="color:var(--error)">nothing matched</span>'} · ${e.ms} ms · ${new Date(e.time).toLocaleTimeString([], { hour12: false })}</span>
    </span>
    <span class="status ${sClass(e.status)}">${e.status}</span>
  </button>`).join('');
}

function logDetail() {
  const e = S.log.find(x => x.id === S.logSel);
  if (!e) return blank('history', 'Pick a request', 'Click anything on the left to see exactly what came in and what went back out.');
  return `<div class="log-detail">
    <h2><span class="method m-${e.method}">${e.method}</span>${esc(e.path)}</h2>
    ${e.source ? '' : `<div class="banner">${icon('error')}<span>Nothing matched this request, so it got a 404.</span><button class="btn text" data-act="mock-this">Mock it</button></div>`}
    <div class="card">
      <div class="card-head"><h3>Response</h3><span class="status ${sClass(e.status)}">${e.status}</span><span class="sub">${e.ms} ms${e.source ? ' · ' + esc(e.source.label) : ''}</span><div class="spacer"></div>${e.source ? `<button class="icon-btn" data-act="open-source" title="Open the ${e.source.type}">${icon('open')}</button>` : ''}</div>
      ${headerList(e.response.headers)}
      ${e.response.body ? `<div class="card-body flush"><pre class="out">${esc(pretty(e.response.body))}</pre></div>` : ''}

    <div class="card">
      <div class="card-head"><h3>Request</h3></div>
      ${headerList(e.request.headers)}

    </div>
  </div>`;
}

function validateText() {
  const el = $('#text-err');
  const area = $('textarea[data-f="bodyText"], textarea[data-f="dataText"]');
  if (!el || !area || !S.draft) return;
  let msg = '';
  if (S.draft.kind === 'route' && S.draft.bodyType === 'json' && area.value.trim()) {
    try { JSON.parse(area.value); } catch (e) { msg = e.message; }
  }
  if (S.draft.kind === 'resource') {
    try {
      if (!Array.isArray(JSON.parse(area.value || '[]'))) msg = 'This needs to be an array';
    } catch (e) { msg = e.message; }
  }
  el.textContent = msg;
  el.hidden = !msg;
  area.classList.toggle('bad', !!msg);
}

async function loadLive() {
  if (!S.draft || S.draft.kind !== 'resource') return;
  const id = S.draft.id;
  const r = S.config.resources.find(x => x.id === id);
  if (!r) return;
  try {
    const data = await api('GET', '/data?path=' + encodeURIComponent(r.path));
    if (!S.draft || S.draft.id !== id) return;
    S.live = data;
    const pre = $('#live');
    if (pre) pre.textContent = JSON.stringify(data, null, 2);
    const count = $('#live-count');
    if (count) count.textContent = data.length + ' in memory';
  } catch {}
}

async function send() {
  const t = S.test;
  const box = $('#try-result');
  const hasBody = !['GET', 'HEAD'].includes(t.method) && t.body.trim();
  const started = performance.now();
  box.innerHTML = '<div class="note" style="margin-top:12px">Sending...</div>';
  try {
    const res = await fetch(ORIGIN + (t.url.startsWith('/') ? t.url : '/' + t.url), {
      method: t.method,
      headers: hasBody ? { 'Content-Type': /^\s*[[{]/.test(t.body) ? 'application/json' : 'text/plain' } : {},
      body: hasBody ? t.body : undefined
    });
    const text = await res.text();
    const ms = Math.round(performance.now() - started);
    const headers = [...res.headers.entries()].filter(([k]) => !k.startsWith('access-control'));
    S.testResult = `<div class="response">
      <div class="response-head"><span class="status ${sClass(res.status)}">${res.status} ${esc(res.statusText)}</span><span>${ms} ms</span><span>${text.length} bytes</span></div>
      ${headerList(Object.fromEntries(headers))}
      ${text ? `<pre class="out" style="border-top:1px solid var(--outline-variant)">${esc(pretty(text))}</pre>` : ''}
    </div>`;
  } catch (e) {
    S.testResult = `<div class="note err" style="margin-top:12px">${esc(e.message)}</div>`;
  }
  box.innerHTML = S.testResult;
}

let menu = null;

function closeMenu() {
  if (!menu) return false;
  menu.el.remove();
  menu.anchor.setAttribute('aria-expanded', 'false');
  document.removeEventListener('pointerdown', menu.outside, true);
  window.removeEventListener('resize', closeMenu);
  menu = null;
  return true;
}

function openMenu(anchor, items) {
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu';
  el.setAttribute('role', 'menu');
  el.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button class="menu-item" role="menuitem" data-i="${i}">${icon(it.icon)}<span>${esc(it.label)}${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</span></button>`).join('');
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.right - el.offsetWidth, window.innerWidth - el.offsetWidth - 8));
  let top = r.bottom + 6;
  if (top + el.offsetHeight > window.innerHeight - 8) {
    top = Math.max(8, r.top - el.offsetHeight - 6);
    el.classList.add('up');
  }
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    closeMenu();
    items[b.dataset.i].run();
  });
  el.addEventListener('keydown', e => {
    const buttons = [...el.querySelectorAll('.menu-item')];
    const i = buttons.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      buttons[(i + (e.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length].focus();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeMenu();
      anchor.focus();
    } else if (e.key === 'Tab') closeMenu();
  });
  const outside = e => {
    if (!el.contains(e.target) && !anchor.contains(e.target)) closeMenu();
  };
  document.addEventListener('pointerdown', outside, true);
  window.addEventListener('resize', closeMenu);
  anchor.setAttribute('aria-expanded', 'true');
  menu = { el, anchor, outside };
  el.querySelector('.menu-item').focus({ preventScroll: true });
}

async function startImport(id) {
  if (!(await guard())) return;
  importDialog(id);
}

function importDialog(id) {
  const d = $('#dialog');
  d.className = 'wide';
  const list = S.importers;
  if (!list.length) return snack('There are no importers available', 'err');
  let saved = null;
  try { saved = localStorage.getItem('apimoketto-importer'); } catch {}
  let kind = list.find(i => i.id === id) || list.find(i => i.id === saved) || list[0];
  d.innerHTML = `<h2>Import from code</h2>
    <div class="row">
      <label class="tf grow"><select id="imp-kind">${list.map(i => `<option value="${esc(i.id)}" ${i.id === kind.id ? 'selected' : ''}>${esc(i.label)} (${esc(i.language)})</option>`).join('')}</select><span>Import from</span>${icon('drop', 'arrow')}</label>
    </div>
    <p id="imp-hint"></p>
    <textarea class="code" id="imp-src" spellcheck="false"></textarea>
    <div class="supporting err" id="imp-err" hidden></div>
    <div class="dialog-row">
      ${textField('Rows', 'id="imp-count"', 10, { type: 'number', mono: true, cls: 'w-sm', attrs: 'min="1" max="500"' })}
      <button class="btn text icon-l" data-dlg="file">${icon('upload', 'sm')}<span id="imp-file-label">Open files</span></button>
      <div class="spacer"></div>
      <button class="btn text" data-dlg="cancel">Cancel</button>
      <button class="btn filled" data-dlg="import" title="Import (Ctrl+Enter)">Import</button>
    </div>
    <input type="file" id="imp-files" multiple hidden>`;
  const src = $('#imp-src', d);
  const err = $('#imp-err', d);
  const files = $('#imp-files', d);
  const showErr = message => {
    err.textContent = message;
    err.hidden = !message;
  };
  const useKind = () => {
    $('#imp-hint', d).innerHTML = esc(kind.hint).replace(/`([^`]+)`/g, '<code>$1</code>');
    src.placeholder = kind.placeholder || '';
    src.dataset.indent = kind.indent || 2;
    files.accept = kind.extensions.join(',');
    $('#imp-file-label', d).textContent = `Open ${kind.extensions.join(' / ')} files`;
    showErr('');
  };
  useKind();
  $('#imp-kind', d).onchange = e => {
    kind = list.find(i => i.id === e.target.value) || list[0];
    try { localStorage.setItem('apimoketto-importer', kind.id); } catch {}
    useKind();
    src.focus();
  };
  d.onkeydown = e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      $('[data-dlg="import"]', d).click();
    }
  };
  const addFiles = async list => {
    const texts = await Promise.all([...list].map(f => f.text()));
    src.value = [src.value.trim(), ...texts].filter(Boolean).join('\n\n');
    showErr('');
  };
  files.onchange = () => addFiles(files.files);
  src.ondragover = e => e.preventDefault();
  src.ondrop = e => {
    e.preventDefault();
    addFiles(e.dataTransfer.files);
  };
  $('[data-dlg="file"]', d).onclick = () => files.click();
  $('[data-dlg="cancel"]', d).onclick = () => d.close();
  $('[data-dlg="import"]', d).onclick = async () => {
    if (!src.value.trim()) return showErr('Paste some code in first.');
    try {
      const { resources } = await api('POST', '/import/' + encodeURIComponent(kind.id), { source: src.value, count: Number($('#imp-count', d).value) || 10 });
      d.close();
      await applyImport(resources);
    } catch (e) {
      showErr(e.message);
    }
  };
  d.onclose = null;
  d.showModal();
  src.focus();
}

async function applyImport(list) {
  if (list.length === 1) {
    const r = list[0];
    const existing = S.config.resources.find(x => x.path === r.path);
    setDraft({
      kind: 'resource',
      id: existing ? existing.id : rid(),
      isNew: true,
      name: r.name,
      path: r.path,
      idField: r.idField,
      persist: existing ? existing.persist : false,
      enabled: true,
      dataText: JSON.stringify(r.data, null, 2)
    });
    S.notes = {
      id: S.draft.id,
      title: `Made from ${r.source}. Look it over, tweak anything you like, then save.`,
      items: existing ? [`Saving will replace the existing ${r.path} resource.`, ...r.notes] : r.notes
    };
    render();
    return;
  }
  const resources = S.config.resources.slice();
  for (const r of list) {
    const i = resources.findIndex(x => x.path === r.path);
    const entry = { ...(i === -1 ? { id: rid(), persist: false } : resources[i]), name: r.name, path: r.path, idField: r.idField, enabled: true, data: r.data };
    if (i === -1) resources.push(entry);
    else resources[i] = entry;
  }
  try { await saveConfig({ ...S.config, resources }); } catch (e) { return snack(e.message, 'err'); }
  const first = S.config.resources.find(x => x.path === list[0].path);
  setDraft(resourceDraft(first));
  S.notes = {
    id: first.id,
    title: `Imported ${list.length} resources: ${list.map(r => `${r.source} as ${r.path}`).join(', ')}.`,
    items: [...new Set(list.flatMap(r => r.notes))]
  };
  render();
  snack(`Imported ${list.length} resources`);
}

function updateBadge() {
  const b = $('#log-badge');
  b.hidden = !S.unseen;
  b.textContent = S.unseen > 99 ? '99+' : S.unseen;
}

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const actions = {
  async 'new-route'() {
    if (!(await guard())) return;
    setDraft(newRouteDraft());
    render();
    $('[data-f="path"]').focus();
  },
  async 'new-resource'() {
    if (!(await guard())) return;
    setDraft(newResourceDraft());
    render();
    $('[data-f="name"]').select();
  },
  cancel() {
    S.dirty = false;
    restoreDraft();
    render();
  },
  async 'save-route'() {
    let route;
    try { route = draftToRoute(S.draft); } catch (e) { return snack(e.message, 'err'); }
    const routes = S.config.routes.slice();
    const i = routes.findIndex(r => r.id === route.id);
    if (i === -1) routes.push(route); else routes[i] = route;
    try { await saveConfig({ ...S.config, routes }); } catch (e) { return snack(e.message, 'err'); }
    const { test, testResult } = S;
    setDraft(routeDraft(S.config.routes.find(r => r.id === route.id)));
    if (test) Object.assign(S, { test, testResult });
    render();
    snack('Saved');
  },
  async 'dup-route'() {
    const src = S.config.routes.find(r => r.id === S.draft.id);
    if (!src || !(await guard())) return;
    setDraft({ ...routeDraft(src), id: rid(), isNew: true, name: (src.name || src.path) + ' (copy)' });
    render();
  },
  async 'del-route'() {
    const ok = await ask({ title: 'Delete this route?', text: `${S.draft.method} ${S.draft.path} will stop responding straight away.`, ok: 'Delete', danger: true });
    if (!ok) return;
    try { await saveConfig({ ...S.config, routes: S.config.routes.filter(r => r.id !== S.draft.id) }); } catch (e) { return snack(e.message, 'err'); }
    S.sel.routes = null;
    restoreDraft();
    render();
    snack('Route deleted');
  },
  async 'save-resource'() {
    let res;
    try { res = draftToResource(S.draft); } catch (e) { return snack(e.message, 'err'); }
    const resources = S.config.resources.slice();
    const i = resources.findIndex(r => r.id === res.id);
    if (i === -1) resources.push(res); else resources[i] = res;
    try { await saveConfig({ ...S.config, resources }); } catch (e) { return snack(e.message, 'err'); }
    setDraft(resourceDraft(S.config.resources.find(r => r.id === res.id)));
    render();
    snack('Saved');
  },
  async 'del-resource'() {
    const ok = await ask({ title: `Delete ${S.draft.name}?`, text: 'All of its endpoints go away, along with anything stored in memory.', ok: 'Delete', danger: true });
    if (!ok) return;
    try { await saveConfig({ ...S.config, resources: S.config.resources.filter(r => r.id !== S.draft.id) }); } catch (e) { return snack(e.message, 'err'); }
    S.sel.resources = null;
    restoreDraft();
    render();
    snack('Resource deleted');
  },
  'reload-live'() { loadLive(); },
  async 'reset-live'() {
    const r = S.config.resources.find(x => x.id === S.draft.id);
    if (!r) return;
    try { await api('POST', '/reset?path=' + encodeURIComponent(r.path)); } catch (e) { return snack(e.message, 'err'); }
    loadLive();
    snack('Back to the seed data');
  },
  'try-ep'(t) {
    S.test.method = t.dataset.m;
    S.test.url = t.dataset.u;
    S.test.body = ['POST', 'PUT', 'PATCH'].includes(t.dataset.m) ? '{\n  "name": "Example"\n}' : '';
    $('#try').outerHTML = tryCard();
    $('#try').scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  'add-header'() {
    S.draft.headers.push(['', '']);
    markDirty();
    render();
    const inputs = document.querySelectorAll('#headers input');
    inputs[inputs.length - 2].focus();
  },
  'rm-header'(t) {
    S.draft.headers.splice(Number(t.dataset.i), 1);
    markDirty();
    render();
  },
  'body-type'(t) {

    markDirty();
    render();
  },
  format() {

      S.draft[key] = JSON.stringify(JSON.parse(S.draft[key]), null, 2);
      $(`[data-f="${key}"]`).value = S.draft[key];
      markDirty();
      validateText();
    } catch (e) { snack("Can't format that: " + e.message, 'err'); }
  },
  send,
  'go-settings'(t, e) {

    go('settings');
  },
  'toggle-missed'() {
    S.onlyMissed = !S.onlyMissed;
    render();
  },
  async 'clear-log'() {
    try { await api('DELETE', '/log'); } catch (e) { snack(e.message, 'err'); }
  },
  async 'mock-this'() {

    S.tab = 'routes';
    history.replaceState(null, '', '#routes');
    let body = '{\n  "ok": true\n}';
    try { if (e.request.body) body = JSON.stringify({ received: JSON.parse(e.request.body) }, null, 2); } catch {}
    setDraft(newRouteDraft({ method: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].includes(e.method) ? e.method : 'ANY', path: e.path.split('?')[0], status: e.method === 'POST' ? 201 : 200, bodyText: body }));
    render();

  'open-source'() {
    const e = S.log.find(x => x.id === S.logSel);
    if (!e || !e.source) return;

    S.sel[tab] = e.source.id;
    go(tab);
  },
  async 'save-settings'() {
    const s = S.settings;
    try { await saveConfig({ ...S.config, settings: { port: Number(s.port) || 3000, delay: Math.max(0, Number(s.delay) || 0), cors: !!s.cors } }); } catch (e) { return snack(e.message, 'err'); }
    S.settings = { ...S.config.settings };
    S.dirty = false;
    render();
    snack('Settings saved');
  },
  'import-code'() {
    startImport();
  },
  'add-menu'(t) {
    if (menu && menu.anchor === t) return closeMenu();
    openMenu(t, [
      { icon: 'add', label: 'Blank resource', hint: 'Start with an empty collection', run: () => actions['new-resource']() },
      { icon: 'code', label: 'Import from code...', hint: 'Turn existing models into a resource', run: () => startImport() }
    ]);
  },
  'dismiss-notes'() {
    S.notes = null;
    render();
  },
  'toggle-theme'() {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  },
  'set-theme'(t) {
    setTheme(t.dataset.v);
  },
  export() { download('mock.json', JSON.stringify(S.config, null, 2)); },
  import() { $('#import-file').click(); },
  'copy-origin'() {
    if (!navigator.clipboard) return snack(ORIGIN);
    navigator.clipboard.writeText(ORIGIN).then(() => snack('Copied ' + ORIGIN), () => snack(ORIGIN));
  }
};

  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;

document.addEventListener('click', async e => {
  if (e.target.closest('dialog')) return;
  const t = e.target.closest('[data-act],[data-route],[data-res],[data-log],[data-tab]');

    $('#log-detail').innerHTML = logDetail();

  const fn = actions[t.dataset.act];

const PAIRS = { '{': '}', '[': ']', '(': ')', '"': '"' };

function edit(t, text, from = t.selectionStart, to = t.selectionEnd) {
  t.setSelectionRange(from, to);
  const ok = text ? document.execCommand('insertText', false, text) : from === to || document.execCommand('delete');
  if (!ok) {
    t.setRangeText(text, from, to, 'end');
    t.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

function codeKeys(e) {
  const t = e.target;
  if (t.tagName !== 'TEXTAREA' || !t.classList.contains('code') || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return false;
  const unit = ' '.repeat(Number(t.dataset.indent) || 2);
  const v = t.value;
  const s = t.selectionStart;
  const end = t.selectionEnd;
  const lineStart = v.lastIndexOf('\n', s - 1) + 1;
  const lead = v.slice(lineStart, s);

  if (e.key === 'Tab') {
    e.preventDefault();
    const multi = v.slice(s, end).includes('\n');
    if (!multi && !e.shiftKey && s === end) {
      edit(t, ' '.repeat(unit.length - ((s - lineStart) % unit.length)));
      return true;
    }
    const last = end > s && v[end - 1] === '\n' ? end - 1 : end;
    let lineEnd = v.indexOf('\n', last);
    if (lineEnd === -1) lineEnd = v.length;
    let first = 0;
    let total = 0;
    const lines = v.slice(lineStart, lineEnd).split('\n').map((line, i) => {
      let delta;
      if (e.shiftKey) {
        delta = -(/^ */.exec(line)[0].length >= unit.length ? unit.length : /^ */.exec(line)[0].length || (line.startsWith('\t') ? 1 : 0));
        line = line.slice(-delta);
      } else {
        delta = line.trim() || !multi ? unit.length : 0;
        line = (delta ? unit : '') + line;
      }
      if (i === 0) first = delta;
      total += delta;
      return line;
    });
    edit(t, lines.join('\n'), lineStart, lineEnd);
    const a = Math.max(lineStart, s + first);
    t.setSelectionRange(a, multi || s !== end ? Math.max(a, end + total) : a);
    return true;
  }

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const indent = /^[ \t]*/.exec(lead)[0];
    const before = v.slice(lineStart, s).trimEnd().slice(-1);
    const rest = /^[ \t]*/.exec(v.slice(end))[0];
    const after = v[end + rest.length];
    if ('{[('.includes(before) && before) {
      if (after === PAIRS[before]) {
        edit(t, '\n' + indent + unit + '\n' + indent, s, end + rest.length);
        const caret = s + 1 + indent.length + unit.length;
        t.setSelectionRange(caret, caret);
      } else edit(t, '\n' + indent + unit);
    } else edit(t, '\n' + indent);
    return true;
  }

  if ('}])'.includes(e.key) && s === end) {
    if (v[s] === e.key) {
      e.preventDefault();
      t.setSelectionRange(s + 1, s + 1);
      return true;
    }
    if (lead && !lead.trim()) {
      e.preventDefault();
      edit(t, lead.slice(0, Math.max(0, lead.length - unit.length)) + e.key, lineStart, s);
      return true;
    }
    return false;
  }

  if (e.key === '"' && s === end && v[s] === '"') {
    e.preventDefault();
    t.setSelectionRange(s + 1, s + 1);
    return true;
  }

  if ('{[("'.includes(e.key) && e.key.length === 1) {
    const next = v[end];
    const prev = v[s - 1];
    if (s !== end) {
      e.preventDefault();
      const inner = v.slice(s, end);
      edit(t, e.key + inner + PAIRS[e.key]);
      t.setSelectionRange(s + 1, s + 1 + inner.length);
      return true;
    }
    const openSpace = next === undefined || /[\s)\]},:;]/.test(next);
    const quoteOk = e.key !== '"' || !/[\w"\\]/.test(prev || '');
    if (openSpace && quoteOk) {
      e.preventDefault();
      edit(t, e.key + PAIRS[e.key]);
      t.setSelectionRange(s + 1, s + 1);
      return true;
    }
    return false;
  }

  if (e.key === 'Backspace' && s === end && s > 0) {
    if (PAIRS[v[s - 1]] && v[s] === PAIRS[v[s - 1]]) {
      e.preventDefault();
      edit(t, '', s - 1, s + 1);
      return true;
    }
    if (lead && !lead.trim() && lead.length >= unit.length && !lead.includes('\t')) {
      e.preventDefault();
      edit(t, '', s - (lead.length % unit.length || unit.length), s);
      return true;
    }
  }
  return false;
}

document.addEventListener('keydown', e => {
  if (codeKeys(e)) return;
  if ($('#dialog').open) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (S.tab === 'settings') actions['save-settings']();
    else if (S.draft && S.draft.kind === 'route') actions['save-route']();
    else if (S.draft && S.draft.kind === 'resource') actions['save-resource']();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.test && $('#try')) {
    e.preventDefault();
    send();
    return;
  }
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.t === 'url') send();
});

$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let cfg;
  try { cfg = JSON.parse(await file.text()); } catch (err) { return snack("That file isn't valid JSON: " + err.message, 'err'); }
  const ok = await ask({ title: 'Replace your config?', text: `Everything currently set up gets swapped for what's in ${file.name}.`, ok: 'Replace', danger: true });
  if (!ok) return;
  try { await saveConfig(cfg); } catch (err) { return snack(err.message, 'err'); }
  S.dirty = false;
  S.settings = { ...S.config.settings };
  restoreDraft();
  render();
  snack('Imported ' + file.name);
});

window.addEventListener('beforeunload', e => {
  if (S.dirty) e.preventDefault();
});

function connect() {
  const es = new EventSource(API + '/events');
  const dot = $('#dot');
  es.onopen = () => {
    dot.classList.add('on');
    dot.parentElement.title = 'Connected, click to copy the base URL';
  };
  es.onerror = () => {
    dot.classList.remove('on');
    dot.parentElement.title = 'Lost connection to ApiMoketto, retrying';
  };
  es.addEventListener('config', e => {
    S.config = JSON.parse(e.data);
    if (S.dirty) {
      updateChrome();
      return renderList();
    }
    if (S.tab === 'settings') S.settings = { ...S.config.settings };
    const { test, testResult, live, notes } = S;
    restoreDraft();
    if (S.draft && test) Object.assign(S, { test, testResult, live });
    if (S.draft && notes && notes.id === S.draft.id) S.notes = notes;
    if (S.tab !== 'log') render();
  });
  es.addEventListener('log', e => {
    const entry = JSON.parse(e.data);
    S.log.unshift(entry);
    if (S.log.length > 300) S.log.pop();
    if (S.tab === 'log') {
      $('#log-rows').innerHTML = logRows();
      $('#log-count').textContent = `${S.log.length} request${S.log.length === 1 ? '' : 's'}, newest first`;
      updateChrome();
    } else {
      S.unseen++;
      updateBadge();
    }
  });
  es.addEventListener('clear', () => {
    S.log = [];
    S.logSel = null;
    S.unseen = 0;
    updateBadge();
    if (S.tab === 'log') render();
  });
  es.addEventListener('data', e => {
    const { path } = JSON.parse(e.data);
    const r = S.draft && S.draft.kind === 'resource' && S.config.resources.find(x => x.id === S.draft.id);
    if (r && r.path === path) loadLive();
  });
  es.addEventListener('invalid', e => snack('The config file has a mistake in it: ' + JSON.parse(e.data).message, 'err'));
}

async function init() {
  applyTheme();
  document.querySelectorAll('[data-icon]').forEach(el => (el.innerHTML = icon(el.dataset.icon)));
  $('#origin').textContent = ORIGIN.replace(/^https?:\/\//, '');
  const [state, log, importers] = await Promise.all([api('GET', '/state'), api('GET', '/log'), api('GET', '/importers').catch(() => [])]);
  S.importers = importers;
  S.config = state.config;
  S.file = state.file;
  S.log = log;
  const tab = location.hash.slice(1);
  S.tab = TITLES[tab] ? tab : 'routes';
  S.settings = { ...S.config.settings };
  restoreDraft();
  render();
  connect();
}

init().catch(e => {
  $('#view').innerHTML = blank('error', "Can't reach ApiMoketto", e.message + '. Is the server still running?');
});
</script>
</body>
</html>
